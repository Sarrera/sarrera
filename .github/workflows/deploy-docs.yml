name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Deployment job using GitHub Pages official action
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare Documentation & Version Artifacts
        run: |
          # 1. Guarantee .nojekyll to prevent Jekyll 404s
          touch docs/.nojekyll
          find docs -type d -name "v*" -exec touch {}/.nojekyll \;
          
          # 2. Guarantee README.md exists for Docsify default route across all versions
          cp -f docs/index.md docs/README.md
          for vdir in docs/v*; do
            if [ -d "$vdir" ] && [ -f "$vdir/index.md" ]; then
              cp -f "$vdir/index.md" "$vdir/README.md" 2>/dev/null || true
              touch "$vdir/.nojekyll" 2>/dev/null || true
            fi
          done
          
          # 3. Ensure brand assets are bundled in docs/assets
          mkdir -p docs/assets
          cp -rn assets/* docs/assets/ 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the docs directory directly (compatible with Docsify and Jekyll)
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
