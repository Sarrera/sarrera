<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sarrera Documentation Portal</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Sarrera: Enterprise Local AI Inference Gateway, Access Control (RBAC), Token Quotas, and Heterogeneous GPU/CPU Orchestration">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="../assets/sarrera-icon.svg" type="image/svg+xml">
  <!-- Theme: Vue / Dark Mode -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">
  <style>
    :root {
      --docsifytabs-border-color: #ededed;
      --docsifytabs-tab-highlight-color: #4b32c3;
      --theme-color: #4b32c3;
    }
    .app-name-link img {
      width: 48px;
      height: 48px;
    }
    .sidebar-nav strong {
      color: var(--theme-color);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    pre[class*="language-"] {
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="app">Loading Sarrera Documentation...</div>
  <script>
    window.$docsify = {
      name: 'Sarrera Docs <span style="font-size: 11px; background: rgba(75,50,195,0.15); border: 1px solid rgba(75,50,195,0.4); color: #7c3aed; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 6px;">v1.1.0</span>',
      repo: 'https://github.com/Sarrera/sarrera',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No matching results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      darklightTheme: {
        siteFont: 'Inter, system-ui, sans-serif',
        defaultTheme: 'light',
        codeFont: 'JetBrains Mono, Menlo, monospace'
      }
    }
  </script>
  <!-- Docsify Core and Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <!-- Prism Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
