<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sarrera Documentation Portal</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Sarrera: Enterprise Local AI Inference Gateway, Access Control (RBAC), Token Quotas, and Heterogeneous GPU/CPU Orchestration">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="assets/sarrera-icon.svg" type="image/svg+xml">
  <!-- Theme: Vue / Dark Mode -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">
  <style>
    :root {
      --docsifytabs-border-color: #ededed;
      --docsifytabs-tab-highlight-color: #4b32c3;
      --theme-color: #4b32c3;
    }
    .app-name-link img {
      width: 48px;
      height: 48px;
    }
    .sidebar-nav strong {
      color: var(--theme-color);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    pre[class*="language-"] {
      border-radius: 8px;
    }
    .version-select {
      display: inline-block;
      margin: 8px 16px 12px 16px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      color: #7c3aed;
      background: rgba(75, 50, 195, 0.08);
      border: 1px solid rgba(75, 50, 195, 0.3);
      border-radius: 6px;
      cursor: pointer;
      width: calc(100% - 32px);
      box-sizing: border-box;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="app">Loading Sarrera Documentation...</div>
  <script>
    window.$docsify = {
      name: 'Sarrera Docs',
      logo: 'assets/sarrera-icon.svg',
      repo: 'https://github.com/Sarrera/sarrera',
      loadSidebar: true,
      loadNavbar: true,
      homepage: 'README.md',
      notFoundPage: '_404.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No matching results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      darklightTheme: {
        siteFont: 'Inter, system-ui, sans-serif',
        defaultTheme: 'light',
        codeFont: 'JetBrains Mono, Menlo, monospace'
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar && !document.querySelector('.version-select-container')) {
              const container = document.createElement('div');
              container.className = 'version-select-container';
              container.style.padding = '0 16px 12px 16px';
              
              const path = window.location.pathname;
              const isV10 = path.includes('/v1.0.0');
              const isV11 = path.includes('/v1.1.0');
              const isV12 = path.includes('/v1.2.0');
              const isLatest = !isV12 && !isV11 && !isV10;
              container.innerHTML = `
                <label style="font-size: 11px; text-transform: uppercase; color: #94A3B8; font-weight: bold; letter-spacing: 0.05em; display: block; margin-bottom: 4px;">Platform Version</label>
                <select class="version-select" onchange="window.location.href=this.value" style="width: 100%; margin: 0; padding: 6px 10px; border-radius: 6px; font-weight: 600; border: 1px solid rgba(75, 50, 195, 0.3); background: rgba(75, 50, 195, 0.06); color: #7c3aed; cursor: pointer;">
                  <option value="#/" \${isLatest ? 'selected' : ''}>v1.3.0 (Current Release)</option>
                  <option value="v1.2.0/#/" \${isV12 ? 'selected' : ''}>v1.2.0 (Previous Release)</option>
                  <option value="v1.1.0/#/" \${isV11 ? 'selected' : ''}>v1.1.0 (Legacy Snapshot)</option>
                  <option value="v1.0.0/#/" \${isV10 ? 'selected' : ''}>v1.0.0 (Legacy Snapshot)</option>
                </select>
              `;
              const appName = document.querySelector('.app-name');
              if (appName && appName.parentNode) {
                appName.parentNode.insertBefore(container, appName.nextSibling);
              }
            }
          });
        }
      ]
    }
  </script>
  <!-- Docsify Core and Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <!-- Prism Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
