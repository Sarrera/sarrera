networks:
  ai-backend:
    driver: bridge

volumes:
  pg_data:
  minio_data:
  openwebui_data:
  caddy_data:
  caddy_config:
  ollama_data:

services:
  # ============================================================================
  # REVERSE PROXY & TLS TERMINATION (Caddy)
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: ai-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/portal:/var/www/portal:ro
      - ./docs:/var/www/docs:ro
      - ./assets:/var/www/assets:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - litellm
      - open-webui
      - langfuse
      - minio
    networks:
      - ai-backend

  # ============================================================================
  # CENTRAL DATABASE (PostgreSQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DBMasterPass2026}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./config/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai-backend

  # ============================================================================
  # OBJECT STORAGE FOR TRACES (MinIO S3)
  # ============================================================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: ai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - ai-backend

  # ============================================================================
  # OBSERVABILITY, AUDITING & METRICS (Langfuse)
  # ============================================================================
  langfuse:
    image: ghcr.io/langfuse/langfuse:2
    container_name: ai-langfuse
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-platform_admin}:${POSTGRES_PASSWORD:-DBMasterPass2026}@postgres:5432/langfuse
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-super_secret_salt_32_characters_long_min}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - SALT=${SALT:-local_salt_for_keys}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse-events
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio_admin}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minio_password}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - ai-backend

  # ============================================================================
  # INFERENCE GATEWAY, ACCESS CONTROL & LOAD BALANCING (LiteLLM Proxy)
  # ============================================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ai-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-platform_admin}:${POSTGRES_PASSWORD:-DBMasterPass2026_ChangeMe}@postgres:5432/litellm
      - STORE_MODEL_IN_DB=${STORE_MODEL_IN_DB:-True}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-master-platform-key-change-me}
      - UI_USERNAME=${ADMIN_USERNAME:-admin}
      - UI_PASSWORD=${ADMIN_PASSWORD:-sk-master-platform-key-change-me}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-setup-key}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-setup-key}
      - LANGFUSE_HOST=http://langfuse:3000
      - GPU_PREMIUM_HOST=${GPU_PREMIUM_HOST:-http://gpu-premium-node:11434}
      - GPU_ENTRY_HOST=${GPU_ENTRY_HOST:-http://gpu-entry-node:11434}
      - CPU_CLUSTER_HOST=${CPU_CLUSTER_HOST:-http://cpu-cluster-node:11434}
    volumes:
      - ./config/litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
      langfuse:
        condition: service_started
    networks:
      - ai-backend

  # ============================================================================
  # ENTERPRISE WEB UI & CHAT (Open WebUI)
  # ============================================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ai-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:-sk-master-platform-key-change-me}
      - WEBUI_SECRET_KEY=${OPENWEBUI_SECRET_KEY:-openwebui_secret_change_me}
      - WEBUI_ADMIN_EMAIL=${ADMIN_EMAIL:-admin@sarrera.local}
      - WEBUI_ADMIN_PASSWORD=${ADMIN_PASSWORD:-sk-master-platform-key-change-me}
      - WEBUI_ADMIN_NAME=${ADMIN_NAME:-Platform Administrator}
      - ENABLE_LDAP=${ENABLE_LDAP:-false}
      - LDAP_SERVER_HOST=${LDAP_SERVER_HOST:-ldap://dc.company.local}
      - LDAP_SERVER_PORT=${LDAP_SERVER_PORT:-389}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-DC=company,DC=local}
      - LDAP_USER_DN=${LDAP_USER_DN:-CN=Users,DC=company,DC=local}
      - LDAP_SEARCH_FILTER=${LDAP_SEARCH_FILTER:-(sAMAccountName={username})}
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      - litellm
    networks:
      - ai-backend

  # ============================================================================
  # LOCAL INFERENCE NODE (Ollama)
  # Provides local compute backend and network aliases for compute nodes
  # ============================================================================
  ollama-local:
    image: ollama/ollama:latest
    container_name: ai-ollama-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      ai-backend:
        aliases:
          - gpu-entry-node
          - cpu-cluster-node
          - gpu-premium-node
